name: Build Native Android APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js & Cordova
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          echo "${{ github.event.client_payload.html }}" > index.html
          cordova create build_tmp com.codingsenpai.app "${{ github.event.client_payload.name }}"
          cp index.html build_tmp/www/index.html
          cd build_tmp
          cordova platform add android
          cordova build android --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.client_payload.name }}.apk
          path: build_tmp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
